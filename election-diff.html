<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elections - White Tiger</title>
    <script src="nav.js?v=3"></script>
    <script src="temp/elections-fallback.js"></script>
    <link rel="stylesheet" href="law-diff.css">
    <script src="law-diff.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Consolas', 'Menlo', 'Monaco', monospace;
            background: #0d1117;
            color: #c9d1d9;
            min-height: 100vh;
            padding: 20px;
        }

        .container { max-width: min(1600px, 100%); margin: 0 auto; }

        /* Prose stays narrow; only the diff blocks use the full width. */
        header, .error-banner { max-width: 900px; }

        header {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        h1 { color: #58a6ff; margin-bottom: 6px; }
        header > p { color: #8b949e; font-size: 0.875rem; }

        .error-banner {
            background: #0d1117;
            border: 1px solid #6e3030;
            border-radius: 6px;
            padding: 10px 14px;
            margin-bottom: 16px;
            font-size: 0.8rem;
            color: #f85149;
            display: none;
        }

        .loading {
            text-align: center;
            padding: 4rem 2rem;
            color: #6e7681;
        }

        .loading .spinner {
            width: 28px;
            height: 28px;
            border: 2.5px solid #30363d;
            border-top-color: #58a6ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .no-data {
            text-align: center;
            padding: 4rem 2rem;
            color: #6e7681;
            font-size: 0.875rem;
        }

        /* ── Election card ──────────────────────────────────── */

        .election-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            margin-bottom: 24px;
            overflow: hidden;
        }

        .election-header {
            display: flex;
            align-items: baseline;
            gap: 10px;
            padding: 14px 20px;
            border-bottom: 1px solid #30363d;
        }

        .state-badge {
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 3px;
            border: 1px solid;
            flex-shrink: 0;
        }

        .election-name { color: #c9d1d9; font-size: 0.95rem; }

        .election-creator {
            color: #6e7681;
            font-size: 0.8rem;
            margin-left: auto;
        }

        /* ── Provision ──────────────────────────────────────── */

        /* Diffs run edge to edge inside the card, matching draft-diff.html. */
        .provision + .provision { border-top: 1px solid #30363d; }

        .provision-title {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 14px 20px 10px;
            font-size: 0.85rem;
        }

        .prov-old { color: #f85149; }
        .prov-arrow { color: #6e7681; }
        .prov-new { color: #3fb950; }

        .prov-old a, .prov-new a { color: inherit; text-decoration: none; }
        .prov-old a:hover, .prov-new a:hover { text-decoration: underline; }

        .delta {
            font-size: 0.8rem;
            flex-shrink: 0;
            white-space: nowrap;
            margin-left: auto;
        }

        .delta .ins { color: #3fb950; }
        .delta .del { color: #f85149; margin-left: 6px; }

        .ud-label {
            font-size: 0.72rem;
            color: #6e7681;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            padding: 10px 14px 4px;
            background: #0d1117;
            border-top: 1px solid #30363d;
        }

        .provision-error {
            color: #f85149;
            font-size: 0.8rem;
            padding: 10px 20px 16px;
        }

    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Law Elections</h1>
            <p>Diff view for active elections proposing law changes.</p>
        </header>
        <div id="error-banner" class="error-banner"></div>
        <div id="main">
            <div class="loading">
                <div class="spinner"></div>
                <p>Loading elections&hellip;</p>
            </div>
        </div>
    </div>

    <script>
        const API = 'https://white-tiger.play.eco/api/v1';

        function escapeHtml(s) {
            return String(s)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function stateColor(state) {
            if (state === 'Active')   return '#3fb950';
            if (state === 'Proposed') return '#e3b341';
            return '#6e7681';
        }

        // ── Main ─────────────────────────────────────────────────────────────────

        function extractLawIds(actionOnComplete) {
            const ids = [...actionOnComplete.matchAll(/view:638:(\d+)/g)].map(m => m[1]);
            return ids.length === 2 ? [ids[0], ids[1]] : null;
        }

        async function main() {
            const container = document.getElementById('main');
            const banner    = document.getElementById('error-banner');

            try {
                const elections = await fetch(`${API}/elections?returnActive=true`)
                    .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
                    .catch(() => {
                        if (window.ELECTIONS_FALLBACK) return window.ELECTIONS_FALLBACK;
                        throw new Error('Server offline and no fallback available');
                    });

                // Filter to elections that have law-change provisions
                const lawElections = elections
                    .map(e => {
                        const provisions = (e.Provisions || [])
                            .map(p => {
                                const ids = extractLawIds(p.ActionOnComplete || '');
                                return ids ? {oldId: ids[0], newId: ids[1]} : null;
                            })
                            .filter(Boolean);
                        return provisions.length > 0 ? {...e, lawProvisions: provisions} : null;
                    })
                    .filter(Boolean);

                if (lawElections.length === 0) {
                    container.innerHTML = '<div class="no-data">No active elections with law changes.</div>';
                    return;
                }

                // Fetch all referenced laws in parallel (deduplicated)
                const allIds = [...new Set(
                    lawElections.flatMap(e => e.lawProvisions.flatMap(p => [p.oldId, p.newId]))
                )];
                const lawMap = {};
                await Promise.all(allIds.map(async id => {
                    const r = await fetch(`${API}/laws/${id}`);
                    if (r.ok) lawMap[id] = await r.json();
                }));

                // Render
                container.innerHTML = lawElections.map(e => {
                    const color = stateColor(e.State);
                    const badge = `<span class="state-badge" style="color:${color};border-color:${color}22;background:${color}11">${escapeHtml(e.State)}</span>`;

                    const provisionsHtml = e.lawProvisions.map(p => {
                        const oldLaw = lawMap[p.oldId];
                        const newLaw = lawMap[p.newId];
                        if (!oldLaw || !newLaw)
                            return `<div class="provision"><div class="provision-error">Could not load laws for this provision (IDs: ${p.oldId} → ${p.newId}).</div></div>`;

                        const oldDescLines = LawDiff.preprocessEcoLines(oldLaw.Description);
                        const newDescLines = LawDiff.preprocessEcoLines(newLaw.Description);
                        const {del, ins}   = LawDiff.countChanges(oldDescLines, newDescLines);

                        let userSection = '';
                        if (oldLaw.UserDescription !== newLaw.UserDescription) {
                            const oldUD = LawDiff.preprocessEcoLines(oldLaw.UserDescription);
                            const newUD = LawDiff.preprocessEcoLines(newLaw.UserDescription);
                            userSection = `
                                <div class="ud-label">Description</div>
                                <div class="diff-split-wrap"><div class="diff-split">${LawDiff.renderSplitBlock(oldUD, newUD)}</div></div>
                            `;
                        }

                        // Sticky column header inside the split names each side, so the
                        // title row above only has to state the change and its size.
                        const head = `
                            <div class="sp-head">
                                <div>Current &middot; <a href="law-view.html?id=${p.oldId}">#${p.oldId}</a></div>
                                <div>Proposed &middot; <a href="law-view.html?id=${p.newId}">#${p.newId}</a></div>
                            </div>`;

                        return `
                            <div class="provision">
                                <div class="provision-title">
                                    <span class="prov-old"><a href="law-view.html?id=${p.oldId}">${escapeHtml(oldLaw.Name)}</a></span>
                                    <span class="prov-arrow">&rarr;</span>
                                    <span class="prov-new"><a href="law-view.html?id=${p.newId}">${escapeHtml(newLaw.Name)}</a></span>
                                    <span class="delta"><span class="ins">+${ins}</span><span class="del">\u2212${del}</span></span>
                                </div>
                                ${userSection}
                                ${head}
                                <div class="diff-split-wrap"><div class="diff-split">${LawDiff.renderSplitBlock(oldDescLines, newDescLines)}</div></div>
                            </div>
                        `;
                    }).join('');

                    return `
                        <div class="election-card">
                            <div class="election-header">
                                ${badge}
                                <span class="election-name">${escapeHtml(e.Name)}</span>
                                <span class="election-creator">by ${escapeHtml(e.Creator)}</span>
                            </div>
                            ${provisionsHtml}
                        </div>
                    `;
                }).join('');

            } catch (err) {
                banner.textContent = `Could not load elections: ${err.message}`;
                banner.style.display = 'block';
                container.innerHTML = '';
            }
        }

        main();
    </script>
</body>
</html>
